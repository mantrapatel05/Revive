services:
  db:
    image: postgres:16
    container_name: revive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: revive_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revive_dev_password}
      POSTGRES_DB: revive
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
