<!doctype html><html><head><meta charset="utf-8"><title>REVIVE Control Room</title><style>body{font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#eef2ff;margin:0;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:#121a30;border:1px solid #273351;border-radius:14px;padding:18px}.num{font-size:30px;font-weight:800}.muted{color:#9aa6c3}pre{white-space:pre-wrap;background:#0a0f1d;padding:14px;border-radius:10px;overflow:auto}button{background:#5b7cfa;color:#fff;border:0;border-radius:8px;padding:8px 12px;margin:4px;cursor:pointer}input{background:#0d1427;border:1px solid #34405f;color:#fff;padding:9px;border-radius:8px}.bar{height:10px;background:#24304f;border-radius:999px;overflow:hidden;margin:7px 0}.fill{height:100%;background:#5b7cfa}.row{display:flex;justify-content:space-between;gap:12px}.tag{padding:3px 7px;border-radius:999px;background:#1d2945}.good{color:#7ee2a8}.warn{color:#ffd166}</style></head><body><h1>REVIVE Control Room</h1><p class="muted">Risk-aware incremental revenue recovery</p><div class="grid"><div class="card"><div class="muted">Safe policy capture</div><div class="num" id="capture">—</div><div class="muted">REVIVE vs constrained oracle</div></div><div class="card"><div class="muted">Expected net value</div><div class="num" id="revive">—</div><div class="muted">Held-out benchmark</div></div><div class="card"><div class="muted">Mean decision regret</div><div class="num" id="regret">—</div><div class="muted">Lower is better</div></div><div class="card"><div class="muted">Unsafe actions</div><div class="num good">0 / 100</div><div class="muted">Adversarial benchmark</div></div></div><div class="card" style="margin-top:16px"><h2>Policy Benchmark</h2><div id="bench"></div></div><div class="card" style="margin-top:16px"><h2>Case Replay</h2><input id="eid" placeholder="EVT-0001"><button onclick="run()">Run</button><button onclick="replay()">Counterfactuals</button><pre id="case">—</pre></div><div class="card" style="margin-top:16px"><h2>Approval Queue</h2><div id="approvals">Loading…</div></div><script>async function j(u,o){let r=await fetch(u,o);return r.json()}async function load(){let d=await j('/api/evaluation');if(!d.error){document.getElementById('capture').textContent=(d.safe_policy_capture*100).toFixed(2)+'%';document.getElementById('revive').textContent='₹'+d.summary.revive.mean_expected_net.toLocaleString('en-IN');document.getElementById('regret').textContent='₹'+d.mean_decision_regret.toLocaleString('en-IN');let h='';for(let [k,v] of Object.entries(d.summary)){h+=`<div class="row"><span>${k}</span><b>₹${v.mean_expected_net.toLocaleString('en-IN')}</b></div><div class="bar"><div class="fill" style="width:${Math.min(100,Math.max(0,v.mean_expected_net/(d.summary.oracle.mean_expected_net||1)*100))}%"></div></div>`}document.getElementById('bench').innerHTML=h}let a=await j('/api/approvals');document.getElementById('approvals').innerHTML=a.approvals.length?a.approvals.map(x=>`<div class="row"><span>${x.case_id} · ₹${x.amount}</span><span class="tag">${x.status}</span></div>`).join(''):'No pending approvals'}async function run(){let id=document.getElementById('eid').value;document.getElementById('case').textContent=JSON.stringify(await j('/api/run-case',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event_id:id})}),null,2)}async function replay(){let id=document.getElementById('eid').value;document.getElementById('case').textContent=JSON.stringify(await j('/api/replay/'+id),null,2)}load()</script></body></html>
